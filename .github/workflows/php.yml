name: PHP runtime validation
on:
  push:
    branches: [refactor/centos7-v1.1.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, curl, fileinfo, mbstring, openssl
          coverage: none
      - run: php scripts/check.php
      - run: php tests/php/run.php
  browser-and-package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: pdo_sqlite, sqlite3, curl, fileinfo, mbstring, openssl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chrome msedge
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm test:e2e && pnpm test:restart && pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: navigation-v1.1.0
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: |
            test-results/
            backups/v1.1.0/evidence/
  release-tag:
    # This one-time release is enabled only by the explicitly named release
    # commit, after CentOS acceptance and every CI job have passed.
    if: github.event_name == 'push' && github.event.head_commit.message == 'release: v1.1.0'
    needs: [php, browser-and-package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve the baseline and publish the verified annotated tag
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/refactor/centos7-v1.1.0
          test "$(git rev-parse 'v1.0.0^{}')" = 0a90bb355ca3938c3e2da1d1f4d33d1fa16f76aa
          # Runtime must exactly match the revision accepted on CentOS.
          git diff --exit-code 43178ddfb8ee121e49d77638975e0f15c4247351 HEAD -- app public database scripts/init.php
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          if git show-ref --verify --quiet refs/tags/v1.1.0; then
            test "$(git cat-file -t refs/tags/v1.1.0)" = tag
            test "$(git rev-parse 'v1.1.0^{}')" = "$GITHUB_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a v1.1.0 "$GITHUB_SHA" -m 'Personal Navigation V1.1.0'
            git push origin refs/tags/v1.1.0
          fi
