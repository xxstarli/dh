# Adapt only this application's vhost; preserve existing server configuration.
server {
    listen 80;
    server_name navigation.example;
    root /srv/navigation/current/public;
    client_max_body_size 4m;

    location = / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param DH_CONFIG /etc/navigation/config.php;
        fastcgi_pass unix:/run/php/navigation.sock;
    }
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/api/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param DH_CONFIG /etc/navigation/config.php;
        fastcgi_pass unix:/run/php/navigation.sock;
    }
    location /assets/ { try_files $uri =404; }
    location / { return 404; }
}
